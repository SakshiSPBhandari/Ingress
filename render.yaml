# Render Blueprint: the backend and the AI service in one free Docker web service.
# Values marked "sync: false" are secrets: Render asks for them when the Blueprint is created.
services:
  - type: web
    name: research-map-api
    runtime: docker
    plan: free
    region: singapore # next to the Neon database (ap-southeast-1)
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/healthz
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: GIN_MODE
        value: release
      # Render's proxy adds X-Forwarded-For; trust it so rate limits see the real visitor address.
      - key: TRUSTED_PROXIES
        value: 0.0.0.0/0,::/0
      - key: WEB_ORIGINS
        value: https://research-map-511920.web.app,https://research-map-511920.firebaseapp.com
      - key: PUBLIC_API_URL
        sync: false # https://<this service>.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AGENT_INTERNAL_KEY
        generateValue: true
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY_4
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
